plugins {
    id 'java'
    id('io.qameta.allure') version "4.1.0"
}

def allureVersion = "2.32.0";

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation "io.qameta.allure:allure-junit5:$allureVersion"
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation 'com.codeborne:selenide:7.16.2'
    testImplementation 'net.datafaker:datafaker:2.7.0'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    if (System.getProperty('browser')) {
        systemProperty 'browser', System.getProperty('browser')
    }
    if (System.getProperty('run')) {
        systemProperty 'run', System.getProperty('run')
    }
}

task positiveTest(type: Test) {
    useJUnitPlatform {
        includeTags 'POSITIVE'
    }
}
